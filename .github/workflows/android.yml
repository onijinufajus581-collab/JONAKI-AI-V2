name: Build JONAKI AI APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jonaki-ai-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Project Files
        run: |
          echo "Checking repository structure..."
          pwd
          ls -la
          echo "App folder:"
          ls -la app || true
          echo "Source folder:"
          ls -R app/src/main || true

      - name: Validate Required Files
        run: |
          set -e

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "gradle.properties"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/jonaki/ai/MainActivity.java"
            "app/src/main/java/com/jonaki/ai/VoiceAssistantService.java"
          )

          MISSING=0

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: Required project files are missing."
            echo "Upload the project files directly to the repository root."
            exit 1
          fi

          echo "All required files found!"

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JONAKI-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
