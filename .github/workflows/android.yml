      - name: Debug Project Structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Checking required files..."

          for file in \
            settings.gradle \
            build.gradle \
            gradle.properties \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/jonaki/ai/MainActivity.java \
            app/src/main/java/com/jonaki/ai/VoiceAssistantService.java
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done
